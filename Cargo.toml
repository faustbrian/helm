[package]
name = "stackctl"
version = "8.0.0"
edition = "2024"
description = "Zero-BS Laravel workspace orchestrator"
license = "MIT"
repository = "https://github.com/faustbrian/stackctl"
readme = "README.md"
keywords = ["laravel", "docker", "workspace", "orchestrator", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
anyhow = "1.0.103"
bollard = { version = "0.21.0", default-features = false, features = ["pipe"] }
colored = "3.1.1"
clap_complete = "4.6.7"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
futures-util = "0.3.32"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
time = { version = "0.3.53", features = ["formatting", "local-offset"] }
tokio = { version = "1.52.3", features = ["fs", "io-util", "net", "rt", "time"] }
signal-hook = "0.4.4"
sha2 = "0.11.0"
base64 = "0.22.1"
bcrypt = "0.19.2"
hex = "0.4.3"
getrandom = "0.4.3"
rcgen = { version = "0.14.8", features = ["x509-parser"] }
x509-parser = "0.18.1"
tar = "0.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
notify = "8.2.0"
rustix = { version = "1.1.4", features = ["process"] }

[lints.rust]
# Absolute safety - forbid unsafe code entirely
unsafe_code = "forbid"

# Documentation and code quality
missing_docs = "warn"

# Rust edition compatibility
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

# Prevent common mistakes
let_underscore_drop = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused = { level = "deny", priority = -1 }

[lints.clippy]
# Keep the enforced baseline intentionally smaller than the set of every
# opt-in Clippy opinion. A lint gate that the crate disables globally provides
# no protection. Every rule below is enforced in normal production code.
all = { level = "deny", priority = -1 }

# Safety-critical lints: production paths return typed errors instead of
# panicking or terminating the process behind their caller.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unwrap_in_result = "deny"
exit = "deny"
mem_forget = "deny"

# Debugging output must not reach a release build.
dbg_macro = "deny"

# High-signal correctness footguns not included in `clippy::all`.
large_include_file = "deny"
infinite_loop = "deny"
lossy_float_literal = "deny"
tests_outside_test_module = "deny"
try_err = "deny"
