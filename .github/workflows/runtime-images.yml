name: Runtime Images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v8.*'

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  php-8-5:
    name: PHP 8.5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Configure BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable runtime
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: images/php/8.5
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: |
            ghcr.io/faustbrian/stackctl-php:8.5
            ghcr.io/faustbrian/stackctl-php:8.5-${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5

      - name: Sign published manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign sign --yes
          "ghcr.io/faustbrian/stackctl-php@${DIGEST}"

      - name: Verify and record published runtime evidence
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/faustbrian/stackctl-php
        run: |
          set -euo pipefail

          readonly evidence=target/runtime-image-evidence/php-8.5
          readonly reference="${IMAGE}@${DIGEST}"
          readonly certificate_identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          mkdir -p "${evidence}"
          printf '%s\n' \
            "reference=${reference}" \
            "source_revision=${GITHUB_SHA}" \
            "workflow_ref=${GITHUB_WORKFLOW_REF}" \
            > "${evidence}/identity.txt"
          docker buildx imagetools inspect "${reference}" \
            > "${evidence}/inspect.txt"
          docker buildx imagetools inspect "${reference}" --raw \
            > "${evidence}/manifest-index.json"
          jq -e '
            [
              .manifests[].platform
              | select(
                  .os == "linux"
                  and (.architecture == "amd64" or .architecture == "arm64")
                )
              | "\(.os)/\(.architecture)"
            ]
            | unique
            | sort
            == ["linux/amd64", "linux/arm64"]
          ' "${evidence}/manifest-index.json"
          docker buildx imagetools inspect "${reference}" \
            --format '{{ json .SBOM }}' > "${evidence}/sbom.json"
          docker buildx imagetools inspect "${reference}" \
            --format '{{ json .Provenance }}' > "${evidence}/provenance.json"
          jq -e '. != null and . != {} and . != []' \
            "${evidence}/sbom.json"
          jq -e '. != null and . != {} and . != []' \
            "${evidence}/provenance.json"
          cosign verify \
            --certificate-identity "${certificate_identity}" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com" \
            --output json \
            "${reference}" > "${evidence}/signature-verification.json"

      - name: Publish runtime image evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-image-evidence-php-8.5
          path: target/runtime-image-evidence/php-8.5
          if-no-files-found: error
          retention-days: 90
