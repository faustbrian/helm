name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-dependency-audit:
    name: V8 Host Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Reject host runtime regressions
        run: ./scripts/audit-v8-host-dependencies.sh

      - name: Reject mutable workflow action references
        run: ./scripts/audit-v8-workflow-actions.sh

      - name: Reject disabled compiler and Clippy diagnostics
        run: ./scripts/audit-v8-lint-policy.sh

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install nightly toolchain with rustfmt
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae
        with:
          components: rustfmt

      - name: Verify formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets --all-features

  supply-chain:
    name: Dependency Security and Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Install pinned audit tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2

      - name: Audit advisories, licenses, duplicates, and sources
        run: ./scripts/audit-v8-supply-chain.sh

  test:
    name: Tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Build release binary
        run: cargo build --release --all-features

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Exercise Engine inventory, workload and shared-service isolation, and data authorization
        if: startsWith(matrix.platform, 'linux-')
        env:
          STACKCTL_ENGINE_SOCKET: /var/run/docker.sock
        run: |
          set -o pipefail
          cargo test live_docker_engine_ -- --ignored --test-threads=1 --nocapture |
            tee target/engine-acceptance-${{ matrix.platform }}.txt

      - name: Exercise amd64-only SQL Server isolation and lifecycle
        if: matrix.platform == 'linux-x86_64'
        env:
          STACKCTL_ENGINE_SOCKET: /var/run/docker.sock
        run: |
          set -o pipefail
          cargo test live_amd64_docker_engine_ -- --ignored --test-threads=1 --nocapture |
            tee -a target/engine-acceptance-${{ matrix.platform }}.txt

      - name: Publish raw Engine acceptance record
        if: startsWith(matrix.platform, 'linux-') && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-acceptance-${{ matrix.platform }}
          path: target/engine-acceptance-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 30

  gateway-acceptance:
    name: Gateway Protocol Acceptance (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false

      - name: Exercise pinned gateway protocols and restart
        run: >-
          ./scripts/accept-v8-gateway.sh
          target/gateway-acceptance-${{ matrix.platform }}.txt

      - name: Publish raw gateway acceptance record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-acceptance-${{ matrix.platform }}
          path: target/gateway-acceptance-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 30
