name: Controlled Benchmark Evidence

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Exact prepared benchmark scenario
        required: true
        type: choice
        options:
          - baseline-engine-idle
          - baseline-one
          - baseline-forty
          - v8-one
          - v8-forty-compatible
          - v8-forty-split
      run_id:
        description: Immutable ID shared by all six scenario captures
        required: true
        type: string
      collector:
        description: Independent host or VM collector and version
        required: true
        type: string
      engine:
        description: Engine product
        required: true
        type: string
      engine_version:
        description: Exact Engine version
        required: true
        type: string
      engine_backend:
        description: VM or backend identity
        required: true
        type: string
      engine_limits:
        description: Exact CPU and memory limits
        required: true
        type: string
      filesystem:
        description: Exact sharing or filesystem mode
        required: true
        type: string
      host_metrics_file:
        description: Absolute path populated by the independent collector
        required: true
        type: string
      external_inventory_file:
        description: Absolute path required for baseline scenarios
        required: false
        type: string
      sample_count:
        description: Sample count for v8 scenarios
        required: true
        default: '12'
        type: string
      interval_seconds:
        description: Interval between v8 samples
        required: true
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-${{ inputs.run_id }}-${{ inputs.scenario }}
  cancel-in-progress: false

jobs:
  capture:
    name: ${{ inputs.scenario }}
    runs-on:
      - self-hosted
      - stackctl-benchmark
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Build locked release binary
        run: cargo build --release --locked

      - name: Capture qualified benchmark evidence
        env:
          SCENARIO: ${{ inputs.scenario }}
          SAMPLE_COUNT: ${{ inputs.sample_count }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
          STACKCTL_BENCHMARK_RUN_ID: ${{ inputs.run_id }}
          STACKCTL_BENCHMARK_COLLECTOR: ${{ inputs.collector }}
          STACKCTL_BENCHMARK_ENGINE: ${{ inputs.engine }}
          STACKCTL_BENCHMARK_ENGINE_VERSION: ${{ inputs.engine_version }}
          STACKCTL_BENCHMARK_ENGINE_BACKEND: ${{ inputs.engine_backend }}
          STACKCTL_BENCHMARK_ENGINE_LIMITS: ${{ inputs.engine_limits }}
          STACKCTL_BENCHMARK_FILESYSTEM: ${{ inputs.filesystem }}
          STACKCTL_BENCHMARK_HOST_METRICS_FILE: ${{ inputs.host_metrics_file }}
          STACKCTL_BENCHMARK_EXTERNAL_INVENTORY_FILE: ${{ inputs.external_inventory_file }}
        run: |
          output="target/benchmark-${SCENARIO}"
          case "${SCENARIO}" in
            baseline-*)
              ./scripts/benchmark-v8.sh "${SCENARIO}" "${output}"
              ;;
            v8-*)
              ./scripts/benchmark-v8.sh \
                "${SCENARIO}" \
                "${output}" \
                "${SAMPLE_COUNT}" \
                "${INTERVAL_SECONDS}"
              ;;
          esac

      - name: Publish immutable raw benchmark record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-${{ inputs.run_id }}-${{ inputs.scenario }}
          path: target/benchmark-${{ inputs.scenario }}
          if-no-files-found: error
          retention-days: 90
